name: Maddie Journey - Validate Prototype

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maddie-journey-validation
  cancel-in-progress: true

jobs:
  test:
    name: Verify sample data and navigation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run regression checks
        run: node tests/smoke.js
