<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f8f9fb">
  <script>
    // Apply saved appearance before styles paint to prevent a bright-to-dark flash.
    (function () {
      var theme = 'light';
      try {
        var saved = localStorage.getItem('maddie-journey-theme');
        if (saved === 'light' || saved === 'dark') theme = saved;
      } catch (err) {}
      document.documentElement.setAttribute('data-theme', theme);
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', theme === 'dark' ? '#1c1c26' : '#f8f9fb');
    })();
  </script>
  <meta name="description" content="Maddie Journey by Madhouse Design Studio — sample employee, division, journey and performance monitoring in one read-only workspace.">
  <title>Maddie Journey · Madhouse Design Studio</title>
  <meta name="color-scheme" content="light dark">
  <link rel="preload" href="./assets/madhalloween.jpg" as="image" type="image/jpeg">
  <link rel="preload" href="./assets/madhouse-logo.png" as="image" type="image/png">
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./theme.css">
  <link rel="stylesheet" href="./operations.css">
  <link rel="stylesheet" href="./palette.css">
  <link rel="stylesheet" href="./landing.css">
  <link rel="stylesheet" href="./workspace.css">
  <link rel="stylesheet" href="./reader.css">
  <link rel="stylesheet" href="./refined.css">
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>
  <div id="app">
    <div class="boot"><p>Opening Maddie Journey…</p></div>
  </div>
  <noscript><p style="padding:30px">JavaScript must be enabled for this prototype.</p></noscript>
  <script src="./data.js" defer></script>
  <script src="./data-adapter.js" defer></script>
  <script src="./app.js" defer></script>
</body>
</html>
