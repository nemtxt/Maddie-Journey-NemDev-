<!doctype html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <script>
    // Apply saved appearance before styles paint to prevent a bright-to-dark flash.
    (function () {
      var theme = 'light';
      try {
        var saved = localStorage.getItem('maddie-journey-theme');
        if (saved === 'light' || saved === 'dark') theme = saved;
      } catch (err) {}
      document.documentElement.setAttribute('data-theme', theme);
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', theme === 'dark' ? '#090909' : '#ffffff');
    })();
  </script>
  <meta name="description" content="Maddie Journey by Madhouse Design Studio — passphrase-protected, read-only People &amp; Culture monitoring.">
