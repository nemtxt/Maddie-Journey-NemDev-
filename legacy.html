<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <script>
    // Apply saved appearance before styles paint to prevent a bright-to-dark flash.
    (function () {
      var theme = 'light';
      try {
        var saved = localStorage.getItem('maddie-journey-theme');
        if (saved === 'light' || saved === 'dark') theme = saved;
      } catch (err) {}
      document.documentElement.setAttribute('data-theme', theme);
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', theme === 'dark' ? '#090909' : '#ffffff');
    })();
  </script>
  <meta name="description" content="Maddie Journey by Madhouse Design Studio — sample employee, division, journey and performance monitoring in one read-only workspace.">
  <title>Maddie Journey · Madhouse Design Studio</title>
  <meta name="color-scheme" content="light dark">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="preload" href="./assets/madhalloween.jpg" as="image" type="image/jpeg">
  <link rel="stylesheet" href="./styles.css">

  <link rel="stylesheet" href="./operations.css">
  <link rel="stylesheet" href="./palette.css">
  <link rel="stylesheet" href="./landing.css">
  <link rel="stylesheet" href="./workspace.css">
  <link rel="stylesheet" href="./reader.css">
  <link rel="stylesheet" href="./refined.css">
  <link rel="stylesheet" href="./mono.css">
</head>
